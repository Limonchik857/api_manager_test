{% extends 'base.html' %}
{% block title %}Проверьте почту — API Automation Studio{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card reveal in">
    <div class="auth-head">
      <div class="auth-badge mono">EMAIL</div>
      <h1>Проверьте почту</h1>
      <p class="auth-sub">Мы отправили ссылку для сброса пароля. В режиме разработки письмо печатается в консоль сервера.</p>
    </div>
    <a href="{% url 'login' %}" class="btn btn-primary btn-block btn-lg">Вернуться ко входу</a>
  </div>
</div>
{% endblock %}
