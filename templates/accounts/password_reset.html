{% extends 'base.html' %}
{% block title %}Reset password — API Automation Studio{% endblock %}
{% block content %}
<div class="page-head"><h1>Reset password</h1></div>
<div class="panel panel-narrow">
  <form method="post">
    {% csrf_token %}
    {% include 'workflows/_form_fields.html' with form=form %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Send reset link</button>
    </div>
  </form>
</div>
{% endblock %}
