{% extends 'base.html' %}
{% block title %}Сброс пароля — API Automation Studio{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card reveal in">
    <div class="auth-head">
      <div class="auth-badge mono">RESET</div>
      <h1>Сброс пароля</h1>
      <p class="auth-sub">Укажите email — пришлём ссылку для восстановления</p>
    </div>
    <form method="post" class="auth-form">
      {% csrf_token %}
      {% include 'workflows/_form_fields.html' with form=form %}
      <button type="submit" class="btn btn-primary btn-block btn-lg">Отправить ссылку</button>
    </form>
    <div class="auth-links">
      <a href="{% url 'login' %}">← Вернуться ко входу</a>
    </div>
  </div>
</div>
{% endblock %}
