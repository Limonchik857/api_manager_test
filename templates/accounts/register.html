{% extends 'base.html' %}
{% block title %}Register — API Automation Studio{% endblock %}
{% block content %}
<div class="page-head"><h1>Create account</h1></div>
<div class="panel panel-narrow">
  <form method="post">
    {% csrf_token %}
    {% include 'workflows/_form_fields.html' with form=form %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Register</button>
    </div>
    <p class="form-help">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </form>
</div>
{% endblock %}
