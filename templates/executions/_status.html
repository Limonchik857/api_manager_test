{% if status == 'success' %}<span class="status status-success">успех</span>
{% elif status == 'failed' %}<span class="status status-failed">ошибка</span>
{% elif status == 'skipped' %}<span class="status status-skipped">пропущен</span>
{% else %}<span class="status status-inactive">{{ status }}</span>
{% endif %}
