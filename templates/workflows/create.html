{% extends 'base.html' %}
{% block title %}Создание сценария — API Automation Studio{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Создание сценария</h1>
</div>
<div class="panel panel-narrow">
  <form method="post">
    {% csrf_token %}
    {% include 'workflows/_form_fields.html' with form=form %}
    <div class="form-actions">
      <a href="{% url 'workflows' %}" class="btn btn-ghost">Отмена</a>
      <button type="submit" class="btn btn-primary">Создать</button>
    </div>
  </form>
</div>
{% endblock %}
